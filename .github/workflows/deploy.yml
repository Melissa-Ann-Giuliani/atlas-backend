# En cada push a main: corre los tests, compila la imagen en GitHub y la publica en GHCR;
# después el runner de talampaya la descarga y reinicia el stack. Ver deploy/README.md.
# En los pull requests a main corren los tests y se verifica que la imagen compile, sin publicar ni desplegar.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-atlas-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/areadesarrollosffha-maxi/atlas-backend

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        run: chmod +x mvnw && ./mvnw -B test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, talampaya]
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/atlas' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            deploy
            init-atlas-db.sql
          sparse-checkout-cone-mode: false

      - name: Write compose file, DB script and .env
        env:
          DB_USERNAME: ${{ vars.DB_USERNAME || 'atlas' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DOMAIN: ${{ vars.DOMAIN || 'atlas.ffha.unsj.edu.ar' }}
          LETSENCRYPT_HOST: ${{ vars.LETSENCRYPT_HOST }}
          PROXY_NETWORK: ${{ vars.PROXY_NETWORK }}
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_PORT: ${{ vars.MAIL_PORT }}
          MAIL_USERNAME: ${{ vars.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          set -eu
          for v in DB_PASSWORD JWT_SECRET PROXY_NETWORK; do
            if [ -z "${!v}" ]; then echo "::error::Falta $v (secret o variable del repo, ver deploy/README.md)"; exit 1; fi
          done
          for v in DB_PASSWORD JWT_SECRET MAIL_PASSWORD; do
            case "${!v}" in *"'"*) echo "::error::$v no puede contener comillas simples"; exit 1;; esac
          done
          mkdir -p "$DEPLOY_DIR"
          cp deploy/docker-compose.yml "$DEPLOY_DIR/docker-compose.yml"
          cp init-atlas-db.sql "$DEPLOY_DIR/init-atlas-db.sql"
          umask 077
          {
            for v in DB_USERNAME DB_PASSWORD JWT_SECRET DOMAIN LETSENCRYPT_HOST PROXY_NETWORK MAIL_HOST MAIL_PORT MAIL_USERNAME MAIL_PASSWORD; do
              printf "%s='%s'\n" "$v" "${!v}"
            done
          } > "$DEPLOY_DIR/.env"
          chmod 600 "$DEPLOY_DIR/.env"
          chmod 644 "$DEPLOY_DIR/init-atlas-db.sql"

      - name: Pull and restart
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -eu
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose pull backend
          docker compose up -d db backend
          docker logout ghcr.io
          docker image prune -f

      - name: Show backend status
        if: always()
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          sleep 30
          docker compose ps
          docker compose logs --tail=40 backend
